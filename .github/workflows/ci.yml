name: ULTRON checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check inline browser scripts
        run: node tests/inline-scripts.test.mjs
      - name: Run skill engine tests
        run: node tests/skill-engine.test.mjs
      - name: Run security and fallback tests
        run: node tests/security.test.mjs
      - name: Run Worker fallback and streaming tests
        run: node --test worker.test.mjs
      - name: Run composer regression tests
        run: node --test tests/composer-regression.test.mjs
      - name: Run mode tests
        run: node --test modes.test.mjs
      - name: Run browser timeout and retry tests
        run: node --test tests/client-timeout.test.mjs
      - name: Run identity regression tests
        run: node --test identity.test.mjs
      - name: Run device registry tests
        run: node --test tests/device-registry.test.mjs
      - name: Run memory relevance tests
        run: node --test memory.test.mjs
      - name: Run coding runtime protocol and policy tests
        run: |
          node --test tests/protocol.test.mjs
          node --test tests/path-policy.test.mjs
          node --test tests/command-policy.test.mjs
      - name: Run coding runtime permission and approval tests
        run: |
          node --test tests/permission-engine.test.mjs
          node --test tests/approval-store.test.mjs
          node --test tests/workspace-policy.test.mjs
      - name: Run coding runtime task and loop tests
        run: |
          node --test tests/task-events.test.mjs
          node --test tests/context-manager.test.mjs
          node --test tests/agent-loop.test.mjs
      - name: Run coding runtime patch, command and daemon tests
        run: |
          node --test tests/patch-manager.test.mjs
          node --test tests/command-runner.test.mjs
          node --test tests/runtime-daemon.test.mjs
